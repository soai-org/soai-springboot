plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '2.6.7'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
}

group = 'springChatbot'
version = '0.0.1-SNAPSHOT'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot 웹
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Lombok
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.3.1' // MyBatis 연동
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'                          // MariaDB 드라이버

    // ===== 개발 편의 =====
    compileOnly 'org.projectlombok:lombok'                                      // Lombok (코드 간결화)
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'            // 개발 편의 (자동 재시작 등)

    // ===== 테스트 =====
    testImplementation 'org.springframework.boot:spring-boot-starter-test'     // 기본 테스트 프레임워크
    testImplementation 'org.springframework.security:spring-security-test'     // Security 관련 테스트
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'                // JUnit 런처
    testImplementation 'com.h2database:h2'                                      // 테스트용 인메모리 데이터베이스

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    implementation 'com.auth0:java-jwt:4.2.0'

    // web-soket
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // 테스트
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
